<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Culvert Rainfall Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
}

#map {
  width:100%;
  height:100%;
}

.legend, .critical-box, .header-box {
  background:white;
  padding:10px;
  font-size:13px;
  border-radius:6px;
  box-shadow:0 0 6px rgba(0,0,0,0.3);
}

.legend i {
  width:14px;
  height:14px;
  float:left;
  margin-right:8px;
  opacity:0.9;
}
</style>
</head>

<body>
<div id="map"></div>

<script>
let map;
let culvertLayer = L.layerGroup();
let stationLayer = L.layerGroup();

const REFRESH_INTERVAL = 180000; // 3 menit

// =======================
// INIT MAP
// =======================
function initMap() {
    map = L.map('map').setView([-2.18, 115.56], 12);

    L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { attribution: 'Tiles © Esri' }
    ).addTo(map);

    culvertLayer.addTo(map);
    stationLayer.addTo(map);

    addUIControls();
}

// =======================
// UI BOXES
// =======================
function addUIControls() {

    // HEADER
    const header = L.control({position: "topright"});
    header.onAdd = function() {
        const div = L.DomUtil.create("div", "header-box");
        div.innerHTML = `
            <b>Culvert Rainfall Monitor</b><br>
            <span id="lastUpdate">Last Update: -</span>
        `;
        return div;
    };
    header.addTo(map);

    // LEGEND
    const legend = L.control({position: "bottomleft"});
    legend.onAdd = function() {
        const div = L.DomUtil.create("div", "legend");
        div.innerHTML = `
            <b>Status Legend</b><br><br>
            <i style="background:green"></i> SAFE<br>
            <i style="background:orange"></i> WARNING<br>
            <i style="background:red"></i> CRITICAL
        `;
        return div;
    };
    legend.addTo(map);

    // CRITICAL LIST
    const critical = L.control({position: "bottomright"});
    critical.onAdd = function() {
        const div = L.DomUtil.create("div", "critical-box");
        div.innerHTML = `
            <b>Critical Culvert</b><br><br>
            <div id="criticalList"></div>
        `;
        return div;
    };
    critical.addTo(map);
}

// =======================
// LOAD STATION
// =======================
async function loadStations() {
    try {
        const response = await fetch('stations.json');
        const stations = await response.json();

        stationLayer.clearLayers();

        stations.forEach(st => {
            if (st.lat && st.lon) {
                L.circleMarker([st.lat, st.lon], {
                    radius: 6,
                    color: "#00FFFF",
                    fillOpacity: 0.8
                })
                .bindPopup(`<b>${st.station}</b>`)
                .addTo(stationLayer);
            }
        });

    } catch (err) {
        console.error("Station load error:", err);
    }
}

// =======================
// LOAD LATEST DATA
// =======================
async function loadLatest() {
    try {
        const response = await fetch('culvert_latest.json?' + new Date().getTime());
        const data = await response.json();

        if (!data || !data.culverts) {
            console.error("Invalid JSON structure");
            return;
        }

        renderLatest(data);
        updateTimestamp(data.timestamp);

    } catch (error) {
        console.error("Error loading latest data:", error);
    }
}

// =======================
// RENDER
// =======================
function renderLatest(data) {

    culvertLayer.clearLayers();
    let criticalList = [];

    data.culverts.forEach(culvert => {

        if (!culvert.lat || !culvert.lon) return;

        let color = "green";
        if (culvert.status === "CRITICAL") color = "red";
        if (culvert.status === "WARNING") color = "orange";

        if (culvert.status === "CRITICAL") {
            criticalList.push(culvert.culvert_id);
        }

        L.circleMarker([culvert.lat, culvert.lon], {
            radius: 8,
            color: color,
            fillColor: color,
            fillOpacity: 0.9
        })
        .bindPopup(`
            <b>${culvert.culvert_id}</b><br>
            Station: ${culvert.station}<br>
            Status: <b>${culvert.status}</b><br>
            Capacity: ${culvert.capacity ?? '-'}<br>
            Rainfall: ${culvert.rainfall_mm ?? '-'} mm
        `)
        .addTo(culvertLayer);

    });

    updateCriticalList(criticalList);
}

// =======================
// UPDATE CRITICAL LIST
// =======================
function updateCriticalList(list) {

    const container = document.getElementById("criticalList");
    if (!container) return;

    container.innerHTML = "";

    if (list.length === 0) {
        container.innerHTML = "<span style='color:green;'>No Critical Culvert</span>";
        return;
    }

    list.forEach(id => {
        const item = document.createElement("div");
        item.style.color = "red";
        item.innerHTML = "• " + id;
        container.appendChild(item);
    });
}

// =======================
// UPDATE TIMESTAMP
// =======================
function updateTimestamp(ts) {
    const el = document.getElementById("lastUpdate");
    if (!el) return;

    el.innerHTML = "Last Update: " + new Date(ts).toLocaleString();
}

// =======================
// INIT
// =======================
async function init() {
    initMap();
    await loadStations();
    await loadLatest();
}

init();

// AUTO REFRESH
setInterval(loadLatest, REFRESH_INTERVAL);

</script>
</body>
</html>
