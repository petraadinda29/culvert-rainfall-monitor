<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Culvert Rainfall Monitor</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
}

#map {
  width:100%;
  height:100%;
}

.legend {
  background:white;
  padding:10px;
  line-height:1.6;
  font-size:13px;
  border-radius:6px;
}

.legend i {
  width:14px;
  height:14px;
  float:left;
  margin-right:8px;
  opacity:0.9;
}

.critical-box {
  background:white;
  padding:10px;
  max-height:200px;
  overflow:auto;
  font-size:12px;
  border-radius:6px;
}

.header-box {
  background:white;
  padding:8px;
  font-size:13px;
  border-radius:6px;
}
</style>
</head>

<body>

<div id="map"></div>

<script>

/* ================= MAP INIT ================= */

const map = L.map('map').setView([-2.18,115.57], 11);

L.tileLayer(
 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
 {
   attribution:'© OpenStreetMap contributors'
 }).addTo(map);

const stationLayer = L.layerGroup().addTo(map);
const culvertLayer = L.layerGroup().addTo(map);

/* ================= HEADER ================= */

const headerBox = L.control({position:'topright'});
headerBox.onAdd = function(){
  const div = L.DomUtil.create('div','header-box');
  div.innerHTML =
    "<b>Culvert Rainfall Monitor</b><br>" +
    "<span id='lastUpdate'>Loading...</span>";
  return div;
};
headerBox.addTo(map);

/* ================= LEGEND ================= */

const legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div','legend');

  div.innerHTML =
    "<b>Legend</b><br>" +
    "<i style='background:green;border-radius:50%;'></i> SAFE<br>" +
    "<i style='background:red;border-radius:50%;'></i> CRITICAL<br>" +
    "<i style='background:yellow;border:1px solid black;'></i> STATION";

  return div;
};
legend.addTo(map);

/* ================= CRITICAL LIST ================= */

const criticalControl = L.control({position:'topleft'});
criticalControl.onAdd = function(){
  const div = L.DomUtil.create('div','critical-box');
  div.innerHTML =
    "<b>Critical Culverts</b><br>" +
    "<div id='criticalList'>Loading...</div>";
  return div;
};
criticalControl.addTo(map);

/* ================= LOAD STATIONS ================= */

async function loadStations(){

  const res = await fetch(
    'dashboard_data/stations.json?v=' + new Date().getTime()
  );
  const json = await res.json();

  stationLayer.clearLayers();

  json.forEach(st => {

    const lat = parseFloat(st.lat);
    const lon = parseFloat(st.lon);

    if(isNaN(lat) || isNaN(lon)) return;

    L.marker([lat,lon],{
      icon: L.divIcon({
        className:'',
        html:'<div style="background:yellow;width:12px;height:12px;border:1px solid black;"></div>',
        iconSize:[12,12]
      })
    })
    .bindPopup("<b>Station:</b> "+st.station)
    .addTo(stationLayer);

  });

}

/* ================= LOAD LATEST ================= */

async function loadLatest(){

  try{

    const response = await fetch(
      'dashboard_data/culvert_latest.json?v=' + new Date().getTime()
    );

    const json = await response.json();

    culvertLayer.clearLayers();

    document.getElementById("lastUpdate").innerHTML =
      "Last Update: " + json.meta.last_update;

    let criticalHTML = "";
    let bounds = [];

    json.data.forEach(item => {

      const lat = parseFloat(item.lat);
      const lon = parseFloat(item.lon);

      if(isNaN(lat) || isNaN(lon)) return;

      bounds.push([lat,lon]);

      const isCritical = item.status === "OVER";

      const marker = L.circleMarker([lat,lon],{
        radius:8,
        fillColor: isCritical ? "red" : "green",
        color:"#000",
        weight:1,
        fillOpacity:0.9
      }).addTo(culvertLayer);

      marker.bindPopup(
        "<b>Culvert:</b> "+item.culvert_id+"<br>"+
        "<b>Station:</b> "+(item.station || "-")+"<br>"+
        "<b>Status:</b> "+item.status+"<br>"+
        "<b>Rainfall:</b> "+item.rainfall_mm+" mm<br>"+
        "<b>Capacity:</b> "+item.capacity+" mm"
      );

      if(isCritical){
        criticalHTML +=
          "<div style='margin-bottom:6px;'>" +
          "<b>"+item.culvert_id+"</b><br>" +
          "Rainfall: "+item.rainfall_mm+" mm" +
          "</div>";
      }

    });

    document.getElementById("criticalList").innerHTML =
      criticalHTML || "No critical culvert";

    if(bounds.length>0){
      map.fitBounds(bounds,{padding:[50,50]});
    }

  }catch(err){
    console.error("Load latest error:",err);
  }
}

/* ================= INIT ================= */

async function init(){
  await loadStations();
  await loadLatest();
}

init();

/* AUTO REFRESH 3 MENIT */
setInterval(loadLatest, 180000);

</script>
</body>
</html>
