<script>

const map = L.map('map').setView([-2.5, 117], 5);

// Google Satellite
L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
  maxZoom: 20,
  subdomains:['mt0','mt1','mt2','mt3']
}).addTo(map);

let markerLayer = L.layerGroup().addTo(map);

async function loadData() {
  try {
    console.log("Fetching JSON...");

    const response = await fetch('./dashboard_data/culvert_latest.json');
    
    if (!response.ok) {
      throw new Error("Network response not OK");
    }

    const json = await response.json();

    console.log("FULL JSON:", json);
    console.log("DATA ARRAY:", json.data);

    // Clear old markers
    markerLayer.clearLayers();

    if (!json.data || json.data.length === 0) {
      console.warn("No data found in JSON");
      return;
    }

    json.data.forEach(item => {

      if (item.lat === null || item.lon === null) return;

      const lat = parseFloat(item.lat);
      const lon = parseFloat(item.lon);

      if (isNaN(lat) || isNaN(lon)) return;

      const color = item.status === "OVER" ? "red" : "green";

      const marker = L.circleMarker([lat, lon], {
        radius: 8,
        fillColor: color,
        color: "#000",
        weight: 1,
        opacity: 1,
        fillOpacity: 0.8
      }).addTo(markerLayer);

      marker.bindPopup(`
        <b>Culvert:</b> ${item.culvert_id || "-"}<br>
        <b>Station:</b> ${item.station || "-"}<br>
        <b>Rainfall:</b> ${item.rainfall_mm ?? "-"} mm<br>
        <b>Capacity:</b> ${item.capacity ?? "-"} mm<br>
        <b>Status:</b> ${item.status || "-"}<br>
        <b>Time:</b> ${item.timestamp || "-"}
      `);

    });

    console.log("Markers loaded:", json.data.length);

  } catch (error) {
    console.error("ERROR loading data:", error);
  }
}

loadData();

// Auto refresh setiap 3 menit
setInterval(() => {
  location.reload();
}, 180000);

</script>
