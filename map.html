<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Culvert Rainfall Monitor</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; }
    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      z-index: 1000;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="legend">
  <b>Status Legend</b><br>
  🟢 SAFE<br>
  🔴 OVER
</div>

<!-- Leaflet JS (letakkan sebelum script map) -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-2.5, 117], 5);

// Google Satellite
L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
  maxZoom: 20,
  subdomains:['mt0','mt1','mt2','mt3']
}).addTo(map);

let markerLayer = L.layerGroup().addTo(map);

async function loadData() {
  try {

    const response = await fetch('./dashboard_data/culvert_latest.json');
    const json = await response.json();

    markerLayer.clearLayers();

    if (!json.data || json.data.length === 0) {
      console.warn("No data found");
      return;
    }

    json.data.forEach(function(item) {

      if (item.lat == null || item.lon == null) return;

      const lat = parseFloat(item.lat);
      const lon = parseFloat(item.lon);

      if (isNaN(lat) || isNaN(lon)) return;

      const color = item.status === "OVER" ? "red" : "green";

      const marker = L.circleMarker([lat, lon], {
        radius: 8,
        fillColor: color,
        color: "#000",
        weight: 1,
        opacity: 1,
        fillOpacity: 0.8
      }).addTo(markerLayer);

      marker.bindPopup(
        "<b>Culvert:</b> " + (item.culvert_id || "-") + "<br>" +
        "<b>Station:</b> " + (item.station || "-") + "<br>" +
        "<b>Rainfall:</b> " + (item.rainfall_mm != null ? item.rainfall_mm : "-") + " mm<br>" +
        "<b>Capacity:</b> " + (item.capacity != null ? item.capacity : "-") + " mm<br>" +
        "<b>Status:</b> " + (item.status || "-") + "<br>" +
        "<b>Time:</b> " + (item.timestamp || "-")
      );

    });

  } catch (error) {
    console.error("ERROR loading data:", error);
  }
}

loadData();

// Auto refresh 3 menit
setInterval(function() {
  location.reload();
}, 180000);

</script>

</body>
</html>
