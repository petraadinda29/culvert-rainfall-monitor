<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Culvert Rainfall Monitor</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; }
    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="legend">
  <b>Status Legend</b><br>
  🟢 SAFE<br>
  🔴 OVER
</div>

<script>

const map = L.map('map').setView([-2.5, 117], 5);

// Google Satellite
L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
  maxZoom: 20,
  subdomains:['mt0','mt1','mt2','mt3']
}).addTo(map);

async function loadData() {
  const response = await fetch('data/culvert_latest.json');
  const json = await response.json();

  json.data.forEach(item => {

    if (!item.lat || !item.lon) return;

    const color = item.status === "OVER" ? "red" : "green";

    const marker = L.circleMarker([item.lat, item.lon], {
      radius: 8,
      fillColor: color,
      color: "#000",
      weight: 1,
      opacity: 1,
      fillOpacity: 0.8
    }).addTo(map);

    marker.bindPopup(`
      <b>Culvert:</b> ${item.culvert_id}<br>
      <b>Station:</b> ${item.station}<br>
      <b>Rainfall:</b> ${item.rainfall_mm} mm<br>
      <b>Capacity:</b> ${item.capacity} mm<br>
      <b>Status:</b> ${item.status}<br>
      <b>Time:</b> ${item.timestamp}
    `);

  });

  console.log("Loaded:", json.meta);
}

loadData();

// Auto refresh setiap 3 menit
setInterval(() => {
  location.reload();
}, 180000);

</script>

</body>
</html>
